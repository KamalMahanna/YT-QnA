services:
  # FastAPI Backend Web Service
  - type: web
    name: yt-qna-backend
    env: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "pip install uv && uv pip install --no-cache-dir --system -r requirements.txt && python -c \"import nltk; nltk.download(['punkt','punkt_tab'])\""
    startCommand: "uvicorn api.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: GEMINI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: yt-qna
      - key: GROQ_API_KEY
        sync: false

  # React / Apple HIG Static Frontend
  - type: static
    name: yt-qna-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: yt-qna-backend
          property: host
